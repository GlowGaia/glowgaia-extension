name: CI

on:
  pull_request:
    branches: [ main, rewrite ]
  push:
    branches: [ rewrite ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck (if present)
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build
